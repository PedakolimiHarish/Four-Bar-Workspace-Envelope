<!DOCTYPE html>
<html>

<head>
    <title>Four-Bar Workspace Envelope</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/plot.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Main vertical container */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* CENTER EVERYTHING HORIZONTALLY */
            width: 100%;
        }

        /* Title */
        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Input row */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            /* CENTER INPUTS */
            margin-bottom: 15px;
        }

        .controls input {
            width: 60px;
            padding: 3px;
            text-align: center;
        }

        .controls button {
            padding: 5px 12px;
            cursor: pointer;
        }

        /* Plot container */
        #plot {
            width: 800px;
            height: 600px;
        }

        .info-panel {
            width: 400px;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .info-panel-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .info-title {
            font-weight: bold;
        }

        .info-value {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="page">

        <h3>Four-Bar Linkage</h3>

        <div class="controls">
            L1: <input id="L1" value="4">
            L2: <input id="L2" value="5">
            L3: <input id="L3" value="5">
            L4: <input id="L4" value="5">

            <label for="driver">Driver Link:</label>
            <select id="driver">
                <option value="2">L2 (Input)</option>
                <option value="4">L4 (Output)</option>
            </select>

            <button onclick="runAnimation()">Run</button>

        </div>

        <div id="error-box" style="
            display:none;
            color:#b00020;
            background:#ffe6e6;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
            font-weight:bold;">
        </div>

        <section class="control-section info-panel">
            <h3 class="info-panel-title">Linkage Properties</h3>

            <div class="info-group">
                <span class="info-title">Input type:</span>
                <span class="info-value" id="input-type">-</span>
            </div>

            <div class="info-group">
                <span class="info-title">Output type:</span>
                <span class="info-value" id="output-type">-</span>
            </div>

            <div class="info-group">
                <span class="info-title">Linkage type:</span>
                <span class="info-value" id="linkage-type">-</span>
            </div>

            <div class="info-group">
                <span class="info-title">Validity index:</span>
                <span class="info-value" id="validity-index">-</span>
            </div>

            <div class="info-group">
                <span class="info-title">Grashof index:</span>
                <span class="info-value" id="grashof-index">-</span>
            </div>
        </section>

        <div id="plot"></div>

        <div style="text-align:center; margin-top:10px;">
            <button onclick="playAnimation()">▶ Play</button>
            <button onclick="pauseAnimation()">⏸ Pause</button>
            <!-- <button onclick="resetAnimation()">⏹ Reset</button> -->
        </div>
    </div>
</body>

</html>
